<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Termwise: one student record, from admission to graduation</title>
  <desc id="d">A paper register sheet. A headline sits above an attendance table for batch ENG-24-ME, where three students fall below the 75 percent cutoff.</desc>
  <rect width="1200" height="630" fill="#f4f2ec"/>
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#d9d5c7"/>

  <text x="60" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#17181a">Termwise</text>
  <text x="1140" y="86" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#5c5a51">college register · phase 1</text>
  <line x1="60" y1="102" x2="1140" y2="102" stroke="#17181a" stroke-width="1"/>

  <text x="60" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#17181a" letter-spacing="-1.5">One student record,</text>
  <text x="60" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#17181a" letter-spacing="-1.5">from admission to graduation.</text>
  <text x="60" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#5c5a51">Attendance, marks, fees and leave on one row per student, in one deployable.</text>

  <rect x="60" y="340" width="1080" height="192" fill="#faf8f2" stroke="#b9b3a1"/>
  <text x="80" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5c5a51">attendance shortage · ME301 · batch ENG-24-ME</text>
  <text x="1120" y="368" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#c4242a">cutoff 75%</text>
  <text x="80" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#84806f">roll no</text>
  <text x="260" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#84806f">student</text>
  <text x="700" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#84806f">attendance</text>
  <text x="1120" y="392" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#84806f">%</text>
  <line x1="80" y1="400" x2="1120" y2="400" stroke="#d9d5c7"/>

  <rect x="60" y="438" width="1080" height="28" fill="#c4242a" opacity="0.05"/>

  <text x="80" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#17181a">ENG-24-ME-0048</text>
  <text x="260" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#17181a">Kajal Dash</text>
  <rect x="700" y="418" width="280" height="7" fill="#ece9dd" stroke="#d9d5c7"/>
  <rect x="700" y="418" width="187" height="7" fill="#c4242a"/>
  <text x="1120" y="426" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#17181a">66.7</text>

  <text x="80" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#17181a">ENG-24-ME-0177</text>
  <text x="260" y="454" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#17181a">Ankit Panda</text>
  <rect x="700" y="446" width="280" height="7" fill="#ece9dd" stroke="#d9d5c7"/>
  <rect x="700" y="446" width="191" height="7" fill="#c4242a"/>
  <text x="1120" y="454" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#17181a">68.3</text>

  <text x="80" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#17181a">ENG-24-ME-0035</text>
  <text x="260" y="482" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#17181a">Ipsita Rout</text>
  <rect x="700" y="474" width="280" height="7" fill="#ece9dd" stroke="#d9d5c7"/>
  <rect x="700" y="474" width="237" height="7" fill="#1d5fbf"/>
  <text x="1120" y="482" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#17181a">84.6</text>

  <line x1="910" y1="412" x2="910" y2="488" stroke="#17181a" stroke-width="1"/>
  <text x="910" y="504" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#84806f">75%</text>

  <text x="80" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#84806f">3 of 60 rows shown · 123 periods held · periods, not sheets, are counted</text>

  <line x1="60" y1="560" x2="1140" y2="560" stroke="#d9d5c7"/>
  <text x="60" y="586" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5c5a51">github.com/moneytosms/termwise</text>
  <text x="1140" y="586" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#84806f">synthetic demo data</text>
</svg>
