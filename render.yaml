# Render Blueprint: one Docker web service and one Postgres database.
# Secrets are generated by Render or entered in the dashboard, never stored here.
services:
  - type: web
    name: termwise
    runtime: docker
    plan: free
    healthCheckPath: /api/health # 503 when the database or a required env var is missing
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: termwise-db, property: connectionString }
      - key: ASSISTANT_DATABASE_URL
        sync: false # postgres://termwise_assistant:<new password>@<same host>/<same db>
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false # the service's public URL, e.g. https://termwise.onrender.com
      - key: CRON_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: google
      - key: LLM_DAILY_CAP
        value: "200"
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
databases:
  - name: termwise-db
    plan: free
    postgresMajorVersion: "18"
