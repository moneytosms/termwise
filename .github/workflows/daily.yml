# Triggers the daily shortage, fee reminder and at-risk job on the live app.
# Needs repository secrets APP_URL and CRON_SECRET; skips quietly until they exist.
name: Daily job
on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the daily job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS --max-time 300 -X POST -H "authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily"
