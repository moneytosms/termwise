name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: termwise
          POSTGRES_PASSWORD: termwise_dev
          POSTGRES_DB: termwise
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U termwise"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://termwise:termwise_dev@localhost:54329/termwise
      ASSISTANT_DATABASE_URL: postgres://termwise_assistant:termwise_assistant_dev@localhost:54329/termwise
      BETTER_AUTH_SECRET: local-only-not-a-real-secret-change-me
      BETTER_AUTH_URL: http://localhost:3000
      LLM_PROVIDER: google
      LLM_DAILY_CAP: "200"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm db:migrate
      - run: pnpm db:seed

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e --reporter=html
        env:
          E2E: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
