services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: termwise
      POSTGRES_PASSWORD: termwise_dev
      POSTGRES_DB: termwise
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: pg_isready -U termwise
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://termwise:termwise_dev@db:5432/termwise
      ASSISTANT_DATABASE_URL: postgres://termwise_assistant:termwise_assistant_dev@db:5432/termwise
      BETTER_AUTH_SECRET: local-only-not-a-real-secret-change-me
      BETTER_AUTH_URL: http://localhost:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      LLM_DAILY_CAP: ${LLM_DAILY_CAP:-200}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports: ["3000:3000"]
    command: sh -c "pnpm db:migrate && pnpm db:seed && pnpm start"
volumes:
  pgdata:
